<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная №2 — материалы и освещение</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #eee; }
    canvas { display: block; }

    #ui {
      position: fixed; top: 12px; left: 12px;
      background: rgba(20,20,20,0.8);
      padding: 14px 16px; border-radius: 10px;
      backdrop-filter: blur(6px);
      border: 1px solid #333;
      min-width: 260px;
      font-size: 13px;
      z-index: 10;
    }
    #ui h3 { margin: 0 0 10px; font-size: 14px; color: #6cf; }
    #ui .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    #ui label { flex: 0 0 90px; color: #bbb; }
    #ui input[type=range] { flex: 1; }
    #ui input[type=color] { width: 40px; height: 24px; border: none; background: none; padding: 0; cursor: pointer; }
    #ui button {
      width: 100%; padding: 8px; margin-top: 6px;
      background: #2a4; color: #fff; border: none; border-radius: 6px;
      cursor: pointer; font-weight: 600;
    }
    #ui button:hover { background: #3c6; }
    #ui .val { flex: 0 0 40px; text-align: right; color: #6cf; font-variant-numeric: tabular-nums; }
    #back {
      position: fixed; top: 12px; right: 12px;
      background: rgba(20,20,20,0.8); color: #6cf;
      padding: 8px 14px; border-radius: 8px;
      text-decoration: none; border: 1px solid #333;
      font-size: 13px; z-index: 10;
    }
    #back:hover { background: rgba(40,40,40,0.9); }
  </style>
</head>
<body>
  <a id="back" href="./index.html">← Task 1–4</a>

  <div id="ui">
    <h3>Источник света (PointLight)</h3>

    <div class="row">
      <label>Цвет</label>
      <input type="color" id="light-color" value="#ffffff">
    </div>

    <div class="row">
      <label>Интенсивность</label>
      <input type="range" id="light-intensity" min="0" max="5" step="0.05" value="1.5">
      <span class="val" id="light-intensity-val">1.5</span>
    </div>

    <div class="row">
      <label>X</label>
      <input type="range" id="light-x" min="-10" max="10" step="0.1" value="5">
      <span class="val" id="light-x-val">5</span>
    </div>
    <div class="row">
      <label>Y</label>
      <input type="range" id="light-y" min="-10" max="10" step="0.1" value="6">
      <span class="val" id="light-y-val">6</span>
    </div>
    <div class="row">
      <label>Z</label>
      <input type="range" id="light-z" min="-10" max="10" step="0.1" value="5">
      <span class="val" id="light-z-val">5</span>
    </div>

    <button id="toggle-orbit">⏸ Остановить вращение</button>
    <div style="margin-top:8px;color:#888;font-size:11px;">
      Зажми <b>Shift</b> + двигай мышь — свет следует за курсором.
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="./lab2.js"></script>
</body>
</html>
